name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Select the next release version
        id: version
        shell: pwsh
        run: |
          $version = node scripts/release-version.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the release version.' }
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the build version.' }
      - run: npm ci
      - run: npm run package
      - run: npm run verify:release
      - name: Verify installation on the clean runner
        shell: pwsh
        run: ./scripts/verify-install.ps1
      - name: Publish the complete release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          @"
          Install Lumen-Setup-$version.exe on each Windows computer. Lumen automatically downloads future releases and installs them when you close the app. Settings, projects, and saved chats stay on that computer.

          Includes Open with Lumen, Start menu and desktop shortcuts, and Settings → Updates. This Windows x64 installer is unsigned; Windows may show SmartScreen on the first installation.

          Source commit: $env:GITHUB_SHA
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create "v$version" "release/Lumen-Setup-$version.exe" "release/Lumen-Setup-$version.exe.blockmap" release/latest.yml --repo mrchevyceleb/lumen --target $env:GITHUB_SHA --title "Lumen $version" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; it has not been published.' }
          gh release edit "v$version" --repo mrchevyceleb/lumen --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }
